<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0f0d; color: #e8e8e4; height: 100vh; display: flex; flex-direction: column;
  }
  #setup {
    padding: 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #222;
    overflow-y: auto;
  }
  #setup.hidden { display: none; }
  #setup label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #999; }
  #setup input, #setup textarea, #setup select {
    width: 100%; background: #14201a; border: 1px solid #2a3d33; color: #e8e8e4;
    padding: 9px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  #setup textarea { min-height: 90px; resize: vertical; }
  #setup button {
    background: #e0a34a; border: none; color: #1a1208; font-weight: 700;
    padding: 11px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
 #bgMedia {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
#bgMedia video,
#bgMedia img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.35; /* ajuste la transparence */
}
/* Le reste de l'interface au-dessus du fond */
#audioLooper, #setup, #topbar, #messages, #inputbar {
  position: relative;
  z-index: 1;
}
/* Un léger voile pour garder le texte lisible */
#messages {
  background: rgba(11, 15, 13, 0.55);
}
  #setup button.secondary {
    background: none; border: 1px solid #333; color: #ccc; font-weight: 600;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #profileBar { display: flex; gap: 8px; align-items: flex-end; }
  #profileBar select { flex: 1; }
  #profileBar button { width: auto; padding: 9px 12px; font-size: 12px; margin-top: 0; white-space: nowrap; }
  hr.sep { border: none; border-top: 1px solid #222; margin: 6px 0; width: 100%; }
  details.advanced { border: 1px solid #222; border-radius: 8px; padding: 8px 10px; }
  details.advanced summary { cursor: pointer; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #999; }
  details.advanced .row { margin-top: 8px; }
  .fieldlabel { font-size: 10px; color: #888; display:block; margin-bottom:3px; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
    border-bottom: 1px solid #222; flex-shrink: 0; gap: 8px;
  }
  #topbar.hidden { display: none; }
  #topbar select {
    background: #14201a; border: 1px solid #2a3d33; color: #e8e8e4; border-radius: 6px;
    padding: 5px 8px; font-size: 11.5px; font-family: inherit; max-width: 140px;
  }
  #topbar div.actions { display: flex; gap: 6px; flex-shrink: 0; }
  #topbar button {
    background: none; border: 1px solid #333; color: #999; border-radius: 6px;
    padding: 5px 10px; font-size: 11px; cursor: pointer;
  }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #messages.hidden { display: none; }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 12px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #e0a34a; color: #1a1208; }
  .msg.bot { align-self: flex-start; background: #17221c; border: 1px solid #263329; }
  .msg.err { align-self: center; background: #3a1414; color: #e0a0a0; font-size: 12.5px; font-family: monospace; }
  .msg.image-loading {
    align-self: flex-start;
    background: #1a2a22;
    border: 1px dashed #3a5a4a;
    color: #a0c0b0;
    font-size: 13px;
    font-style: italic;
  }
  .msg img {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 8px;
    display: block;
  }
  .msg-content { white-space: pre-wrap; }
  .msg-time {
    font-size: 10px;
    margin-top: 4px;
    opacity: 0.6;
  }
  .msg.user .msg-time { text-align: right; color: #1a1208; }
  .msg.bot .msg-time { text-align: left; color: #e8e8e4; }
  #inputbar { display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom,0px) + 10px); border-top: 1px solid #222; flex-shrink: 0; }
  #inputbar.hidden { display: none; }
  #inputbar textarea {
    flex: 1; resize: none; background: #14201a; border: 1px solid #2a3d33; color: #e8e8e4;
    border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit; max-height: 100px;
  }
  #send { background: #e0a34a; border: none; color: #1a1208; font-weight: 700; width: 46px; border-radius: 10px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  #send:disabled { background: #3a3a34; color: #777; }
  .typing { align-self: flex-start; color: #777; font-size: 13px; font-style: italic; padding: 4px 4px; }
</style>
</head>
<body>
<div id="bgMedia"></div>
<!-- Lecteur multi-boucles -->
<div id="audioLooper" style="
  background:#121a16; border-bottom:1px solid #222; padding:10px 14px;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
">
  <span style="font-size:12px; color:#999; margin-right:6px;">🔊 Boucles :</span>

    <span style="font-size:11px; color:#999;">Volume</span>

<div id="setup">
  <div id="profileBar">
    <div style="flex:2">
      <label>Profil enregistré</label>

    </div>

  <hr class="sep">

        <option value="groq">groq</option>
        <option value="openrouter">openrouter</option>
        <option value="cerebras">cerebras</option>
        <option value="mistral">mistral</option>
        <option value="nvidia">nvidia</option>
        <option value="hf">hf</option>

      </select>
    </div>
    <div>
      <label>Modèle</label>

    </div>
  </div>
  <div>
    <label>Mot de passe (worker)</label>

  </div>
  <div>

  <div>
    <label>Prompt système / personnalité</label>

<div id="messages" class="hidden"></div>

<div id="inputbar" class="hidden">

</div>

<script>
const WORKER_BASE = 'https://routeur-ia-proxy.zacharybov.workers.dev/proxy/';
const HISTORY_WINDOW = 8;
const STORAGE_KEY = 'chat_profiles_v2';
const LAST_PROFILE_KEY = 'chat_last_profile_v2';
const ELEVEN_VOICE_ID = "EXAVITQu4vr4xnSDxMaL";

let provider = 'groq';
let model = '';
let password = '';
let systemPrompt = '';
let physicalDescription = '';
let genPerchance = true;
let genHFSpace = false;
let hfSpaceId = 'properfool/nsfwadult';
let genPollination = false;
let genAIHorde = false;
let genVenice = false;
let ttsEleven = true;   // comportement historique : ElevenLabs actif par défaut
let ttsBrowser = false;
let profileName = '';
let sampling = {};
let history = [];

const setup = document.getElementById('setup');
const topbar = document.getElementById('topbar');
const messagesEl = document.getElementById('messages');
const inputbar = document.getElementById('inputbar');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const profileSelect = document.getElementById('profileSelect');
const quickSwitch = document.getElementById('quickSwitch');

function loadProfiles() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
}
function saveProfiles(profiles) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
}

function readSamplingFromForm() {
  return {
    temperature: parseFloat(document.getElementById('p_temperature').value) || 1.0,
    top_p: parseFloat(document.getElementById('p_top_p').value) || 1.0,
    frequency_penalty: parseFloat(document.getElementById('p_frequency_penalty').value) || 0,
    presence_penalty: parseFloat(document.getElementById('p_presence_penalty').value) || 0,
    max_tokens: parseInt(document.getElementById('p_max_tokens').value) || 800
  };
}
function writeSamplingToForm(s) {
  s = s || {};
  document.getElementById('p_temperature').value = s.temperature ?? 1.0;
  document.getElementById('p_top_p').value = s.top_p ?? 1.0;
  document.getElementById('p_frequency_penalty').value = s.frequency_penalty ?? 0;
  document.getElementById('p_presence_penalty').value = s.presence_penalty ?? 0;
  document.getElementById('p_max_tokens').value = s.max_tokens ?? 800;
}

function readImageGeneratorsFromForm() {
  return {
    perchance: document.getElementById('genPerchance').checked,
    hfSpace: document.getElementById('genHFSpace').checked,
    hfSpaceId: document.getElementById('hfSpaceId').value.trim() || 'properfool/nsfwadult',
    pollination: document.getElementById('genPollination').checked,
    aiHorde: document.getElementById('genAIHorde').checked,
    venice: document.getElementById('genVenice').checked
  };
}

function readTtsFromForm() {
  return {
    eleven: document.getElementById('ttsEleven').checked,
    browser: document.getElementById('ttsBrowser').checked
  };
}

function refreshProfileSelects(selectName) {
  const profiles = loadProfiles();
  const names = Object.keys(profiles).sort();
  profileSelect.innerHTML = '<option value="">— Nouveau profil —</option>';
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    profileSelect.appendChild(opt);
  });
  if (selectName && profiles[selectName]) profileSelect.value = selectName;

  quickSwitch.innerHTML = '';
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    quickSwitch.appendChild(opt);
  });
  if (selectName) quickSwitch.value = selectName;
}

function fillFormFromProfile(name) {
  const p = loadProfiles()[name];
  if (!p) return;
  document.getElementById('provider').value = p.provider || 'groq';
  document.getElementById('model').value = p.model || '';
  document.getElementById('password').value = p.password || '';
  document.getElementById('profileName').value = name;
  document.getElementById('systemPrompt').value = p.systemPrompt || '';
  document.getElementById('physicalDescription').value = p.physicalDescription || '';
  const igForm = p.imageGenerators || {};
  document.getElementById('genPerchance').checked = igForm.perchance !== false;
  document.getElementById('genHFSpace').checked = !!igForm.hfSpace;
  document.getElementById('hfSpaceId').value = igForm.hfSpaceId || 'properfool/nsfwadult';
  document.getElementById('genPollination').checked = !!igForm.pollination;
  document.getElementById('genAIHorde').checked = !!igForm.aiHorde;
  document.getElementById('genVenice').checked = !!igForm.venice;
  const ttsForm = p.tts || {};
  document.getElementById('ttsEleven').checked = ttsForm.eleven !== false;
  document.getElementById('ttsBrowser').checked = !!ttsForm.browser;
  writeSamplingToForm(p.sampling);
}

profileSelect.addEventListener('change', () => {
  if (profileSelect.value) fillFormFromProfile(profileSelect.value);
});

document.getElementById('saveProfileBtn').addEventListener('click', () => {
  const name = document.getElementById('profileName').value.trim();
  if (!name) { alert("Donne un nom à ce profil avant de l'enregistrer."); return; }
  const profiles = loadProfiles();
  const existingHistory = (profiles[name] && profiles[name].history) || [];
  profiles[name] = {
    provider: document.getElementById('provider').value,
    model: document.getElementById('model').value.trim(),
    password: document.getElementById('password').value,
    systemPrompt: document.getElementById('systemPrompt').value.trim(),
    physicalDescription: document.getElementById('physicalDescription').value.trim(),
    imageGenerators: readImageGeneratorsFromForm(),
    tts: readTtsFromForm(),
    sampling: readSamplingFromForm(),
    history: existingHistory
  };
  saveProfiles(profiles);
  refreshProfileSelects(name);
  alert('Profil "' + name + '" enregistré.');
});

document.getElementById('deleteProfileBtn').addEventListener('click', () => {
  const name = profileSelect.value;
  if (!name) return;
  if (!confirm('Supprimer le profil "' + name + '" (et son historique) ?')) return;
  const profiles = loadProfiles();
  delete profiles[name];
  saveProfiles(profiles);
  refreshProfileSelects();
  document.getElementById('profileName').value = '';
});

window.addEventListener('DOMContentLoaded', () => {
  refreshProfileSelects();
  const lastUsed = localStorage.getItem(LAST_PROFILE_KEY);
  if (lastUsed && loadProfiles()[lastUsed]) {
    profileSelect.value = lastUsed;
    fillFormFromProfile(lastUsed);
  }
});

function persistCurrentHistory() {
  if (!profileName) return;
  const profiles = loadProfiles();
  if (!profiles[profileName]) return;
  profiles[profileName].history = history;
  saveProfiles(profiles);
}

function activateProfile(name, isSwitch) {
  const profiles = loadProfiles();
  const p = profiles[name];
  if (!p) return;
  if (isSwitch) persistCurrentHistory();
  profileName = name;
  provider = p.provider || 'groq';
  model = p.model || '';
  password = p.password || '';
  systemPrompt = p.systemPrompt || '';
  physicalDescription = p.physicalDescription || '';
  const ig = p.imageGenerators || {};
  genPerchance = ig.perchance !== false;
  genHFSpace = !!ig.hfSpace;
  hfSpaceId = ig.hfSpaceId || 'properfool/nsfwadult';
  genPollination = !!ig.pollination;
  genAIHorde = !!ig.aiHorde;
  genVenice = !!ig.venice;
  const ttsCfg = p.tts || {};
  ttsEleven = ttsCfg.eleven !== false;
  ttsBrowser = !!ttsCfg.browser;
  sampling = p.sampling || {};
  history = p.history || [];
  localStorage.setItem(LAST_PROFILE_KEY, profileName);
  messagesEl.innerHTML = '';
  history.forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'bot', m.ts));
  if (history.length === 0 && systemPrompt) sendToWorker('__init__');
}

document.getElementById('startBtn').addEventListener('click', () => {
  const pw = document.getElementById('password').value.trim();
  const mdl = document.getElementById('model').value.trim();
  const name = document.getElementById('profileName').value.trim();
  if (!pw) { alert('Entre le mot de passe du worker.'); return; }
  if (!mdl) { alert('Entre le nom du modèle à utiliser.'); return; }
  if (name) {
    const profiles = loadProfiles();
    const existingHistory = (profiles[name] && profiles[name].history) || [];
    profiles[name] = {
      provider: document.getElementById('provider').value,
      model: mdl,
      password: pw,
      systemPrompt: document.getElementById('systemPrompt').value.trim(),
      physicalDescription: document.getElementById('physicalDescription').value.trim(),
      imageGenerators: readImageGeneratorsFromForm(),
      tts: readTtsFromForm(),
      sampling: readSamplingFromForm(),
      history: existingHistory
    };
    saveProfiles(profiles);
    refreshProfileSelects(name);
  }
  setup.classList.add('hidden');
  topbar.classList.remove('hidden');
  messagesEl.classList.remove('hidden');
  inputbar.classList.remove('hidden');
  if (name) {
    activateProfile(name, false);
  } else {
    profileName = '';
    provider = document.getElementById('provider').value;
    model = mdl;
    password = pw;
    systemPrompt = document.getElementById('systemPrompt').value.trim();
    physicalDescription = document.getElementById('physicalDescription').value.trim();
    const ig = readImageGeneratorsFromForm();
    genPerchance = ig.perchance;
    genHFSpace = ig.hfSpace;
    hfSpaceId = ig.hfSpaceId;
    genPollination = ig.pollination;
    genAIHorde = ig.aiHorde;
    genVenice = ig.venice;
    const ttsCfg = readTtsFromForm();
    ttsEleven = ttsCfg.eleven;
    ttsBrowser = ttsCfg.browser;
    sampling = readSamplingFromForm();
    history = [];
    messagesEl.innerHTML = '';
    if (systemPrompt) sendToWorker('__init__');
  }
  input.focus();
});

quickSwitch.addEventListener('change', () => {
  if (quickSwitch.value && quickSwitch.value !== profileName) activateProfile(quickSwitch.value, true);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Vider l\'historique de cette conversation ?')) return;
  history = [];
  messagesEl.innerHTML = '';
  persistCurrentHistory();
  if (systemPrompt) sendToWorker('__init__');
});

document.getElementById('backBtn').addEventListener('click', () => {
  persistCurrentHistory();
  topbar.classList.add('hidden');
  messagesEl.classList.add('hidden');
  inputbar.classList.add('hidden');
  setup.classList.remove('hidden');
});

// ========== Rendu markdown basique + horodatage ==========
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderMarkdownBasic(text) {
  let out = escapeHtml(text);
  out = out.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
  return out;
}

function formatTime(ts) {
  const d = new Date(ts || Date.now());
  return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

function addMessage(text, cls, ts) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (cls === 'user' || cls === 'bot') {
    const content = document.createElement('div');
    content.className = 'msg-content';
    content.innerHTML = renderMarkdownBasic(text);
    div.appendChild(content);
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = formatTime(ts);
    div.appendChild(time);
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function buildMessages(userText, isInit) {
  const recent = history.slice(-HISTORY_WINDOW);
  const messages = [];
  if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
  for (const m of recent) messages.push({ role: m.role, content: m.content });
  if (isInit) {

    const baseVolume = sound.baseVolume ?? 0.7;
    audio.volume = baseVolume * masterVolume;

    if (hasRange) {
      let currentStart = randomBetween(sound.startMin, sound.startMax);
      let currentEnd = randomBetween(sound.endMin, sound.endMax);

      const playNext = () => {
        currentStart = randomBetween(sound.startMin, sound.startMax);
        currentEnd = randomBetween(sound.endMin, sound.endMax);
        if (currentEnd <= currentStart + 0.05) currentEnd = currentStart + 0.15;
        audio.currentTime = currentStart;

      const timer = setInterval(() => {
        if (audio.currentTime >= currentEnd) playNext();

      activeLoops[sound.id] = { audio, timer, baseVolume };

      audio.play().catch(console.error);
      activeLoops[sound.id] = { audio, timer: null, baseVolume };

// L'API Gradio (Space HF) fonctionne en deux étapes : un POST qui renvoie un event_id, puis
// une lecture en flux (SSE) de cet event_id qui livre le résultat une fois le calcul terminé.
// C'est l'étape qui manquait dans l'ancienne version (elle faisait un .json() direct sur
// la réponse du POST, qui ne contient que l'event_id — jamais l'image).

function getHFSpaceBase() {

function extractAction(botText) {
  const actions = [...botText.matchAll(/\*([^*]+)\*/g)].map(m => m[1].trim()).filter(Boolean);
  if (actions.length) return actions.join(', ');
  // Pas d'action entre astérisques dans ce message : on retombe sur un extrait court du texte.
  return botText.replace(/"/g, '').slice(0, 150).trim();

// Prompt partagé par les trois générateurs : description physique du personnage (profil)
// + action/position extraite du dernier message + les tags de style fixes.
function buildImagePrompt(botText, maxLen) {
  const action = extractAction(botText);
  const parts = [
    'masterpiece, best quality, highly detailed explicit erotic scene',
    physicalDescription,
    action,

// Isole chaque appel de générateur : une erreur synchrone dans l'un ne peut plus jamais
// empêcher les suivants de se déclencher (c'est ce qui s'est passé avec Pollination).
function safeTrigger(fn) {
  try { fn(); } catch (err) { console.error('Erreur déclenchement générateur:', err); }
}

async function callHFSpace(dataArray, timeoutMs) {
  timeoutMs = timeoutMs || 30000;
  const base = getHFSpaceBase();
  const submitRes = await fetch(base, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ data: dataArray })
  });
  if (!submitRes.ok) throw new Error('Soumission refusée (' + submitRes.status + ')');
  const { event_id } = await submitRes.json();
  if (!event_id) throw new Error('Pas d\'event_id reçu');

  const streamRes = await fetch(base + '/' + event_id);
  if (!streamRes.ok || !streamRes.body) throw new Error('Flux de résultat indisponible (' + streamRes.status + ')');

  const reader = streamRes.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let finalData = null;
  let gotError = false;
  const deadline = Date.now() + timeoutMs;

  // Le Space peut rester coincé en file d'attente (heartbeats sans fin, ex. ZeroGPU sans
  // authentification) : on borne la lecture au lieu d'attendre indéfiniment un "complete"
  // qui peut ne jamais arriver.
  while (true) {
    const remaining = deadline - Date.now();
    if (remaining <= 0) {
      try { reader.cancel(); } catch (e) {}
      throw new Error('Délai dépassé (file d\'attente GPU jamais aboutie)');
    }
    let timedOut = false;
    const result = await Promise.race([
      reader.read(),
      new Promise(resolve => setTimeout(() => { timedOut = true; resolve(null); }, remaining))
    ]);
    if (timedOut || !result) {
      try { reader.cancel(); } catch (e) {}
      throw new Error('Délai dépassé (file d\'attente GPU jamais aboutie)');
    }
    const { done, value } = result;
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split('\n\n');
    buffer = events.pop();
    for (const evt of events) {
      let eventType = 'message';
      let dataLine = '';
      for (const line of evt.split('\n')) {
        if (line.startsWith('event:')) eventType = line.slice(6).trim();
        if (line.startsWith('data:')) dataLine = line.slice(5).trim();
      }
      if (eventType === 'complete') {
        try { finalData = JSON.parse(dataLine); } catch (e) {}
      } else if (eventType === 'error') {
        gotError = true;
      }
    }
    if (finalData || gotError) break;
  }

  if (gotError || !finalData) throw new Error('Le Space a renvoyé une erreur ou aucun résultat');
  return finalData;
}

function extractHFImageUrl(finalData) {
  let first = Array.isArray(finalData) ? finalData[0] : finalData;
  if (Array.isArray(first)) first = first[0];
  if (first && typeof first === 'object') return first.url || first.path || null;
  if (typeof first === 'string') return first;
  return null;
}

  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg image-loading';
  loadingDiv.textContent = '🎨 Génération de l\'image en cours (Pollination)...';
  messagesEl.appendChild(loadingDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const prompt = buildImagePrompt(botText, 700);
    const seed = Math.floor(Math.random() * 1000000);
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=512&model=flux&seed=${seed}&nologo=true`;

    const img = new Image();
    img.onload = () => {
      loadingDiv.remove();
      const imgDiv = document.createElement('div');
      imgDiv.className = 'msg bot';
      img.alt = 'Image générée (Pollination)';
      img.style.maxWidth = '100%';
      img.style.borderRadius = '10px';
      img.style.display = 'block';
      imgDiv.appendChild(img);
      messagesEl.appendChild(imgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };
    img.onerror = () => {
      loadingDiv.remove();
      const errDiv = document.createElement('div');
      errDiv.className = 'msg image-loading';
      errDiv.textContent = '⚠️ Pollination : image non chargée.';
      messagesEl.appendChild(errDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };
    img.src = url;
  } catch (err) {
    loadingDiv.remove();
    console.error('Erreur Pollination:', err);
    const errDiv = document.createElement('div');
    errDiv.className = 'msg image-loading';
    errDiv.textContent = '❌ Pollination : ' + (err.message || 'génération échouée');
    messagesEl.appendChild(errDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

// ========== GÉNÉRATION D'IMAGE via AI Horde (gratuit, communautaire, NSFW natif) ==========
// Réseau de GPU donnés par des bénévoles — gratuit sans inscription (clé anonyme), pas de
// file d'attente réservée aux comptes authentifiés comme ZeroGPU. Fonctionne par polling :
// on soumet, puis on interroge périodiquement jusqu'à ce que l'image soit prête.
// Passe par le Worker (/proxy/horde/...) plutôt que d'appeler aihorde.net directement
// depuis le navigateur, pour éviter tout souci de CORS et utiliser la vraie clé AIHORDE_KEY
// côté serveur (meilleure priorité dans la file que la clé anonyme).
async function callAIHorde(prompt) {
  const submitRes = await fetch(WORKER_BASE + 'horde/generate/async', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Secret': password },
    body: JSON.stringify({
      prompt,
      nsfw: true,
      censor_nsfw: false,
      params: {
        width: 768,
        height: 512,
        steps: 25,
        cfg_scale: 7,
        sampler_name: 'k_euler_a',
        n: 1
      }
    })
  });
  if (!submitRes.ok) throw new Error('Soumission refusée (' + submitRes.status + ')');
  const { id } = await submitRes.json();
  if (!id) throw new Error('Pas d\'id de génération reçu');

  const deadline = Date.now() + 90000; // la file bénévole peut être plus lente qu'un service dédié
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 4000));
    const checkRes = await fetch(WORKER_BASE + 'horde/generate/check/' + id, {
      headers: { 'X-App-Secret': password }
    });
    if (!checkRes.ok) continue;
    const checkData = await checkRes.json();
    if (checkData.faulted) throw new Error('génération en échec côté Horde');
    if (checkData.done) {
      const statusRes = await fetch(WORKER_BASE + 'horde/generate/status/' + id, {
        headers: { 'X-App-Secret': password }
      });
      if (!statusRes.ok) throw new Error('résultat indisponible (' + statusRes.status + ')');
      const statusData = await statusRes.json();
      const gen = statusData.generations && statusData.generations[0];
      if (gen && gen.img) return gen.img;
      throw new Error('aucune image dans le résultat');
    }
  }
  throw new Error('délai dépassé (file d\'attente trop longue)');
}

async function generateAIHordeImage(botText) {
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg image-loading';
  loadingDiv.textContent = '🎨 Génération de l\'image en cours (AI Horde)...';
  messagesEl.appendChild(loadingDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const prompt = buildImagePrompt(botText, 700);
    const imgUrl = await callAIHorde(prompt);
    loadingDiv.remove();
    const imgDiv = document.createElement('div');
    imgDiv.className = 'msg bot';
    imgDiv.innerHTML = `<img src="${imgUrl}" alt="Image générée (AI Horde)" style="max-width:100%; border-radius:10px;">`;
    messagesEl.appendChild(imgDiv);
  } catch (err) {
    loadingDiv.remove();
    console.error('Erreur AI Horde:', err);
    const errDiv = document.createElement('div');
    errDiv.className = 'msg image-loading';
    errDiv.textContent = '❌ AI Horde : ' + (err.message || 'génération échouée');
    messagesEl.appendChild(errDiv);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ========== GÉNÉRATION D'IMAGE via Venice AI ==========
// Point d'accès compatible OpenAI (/images/generations), réponse en base64 directement
// utilisable. Passe par le Worker (VENICE_KEY reste côté serveur).
async function generateVeniceImage(botText) {
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg image-loading';
  loadingDiv.textContent = '🎨 Génération de l\'image en cours (Venice)...';
  messagesEl.appendChild(loadingDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const prompt = buildImagePrompt(botText, 1400);
    const res = await fetch(WORKER_BASE + 'venice-images', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Secret': password },
      body: JSON.stringify({
        prompt,
        model: 'venice-sd35',
        n: 1,
        size: '768x512',
        response_format: 'b64_json',
        moderation: 'low'
      })
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error('Erreur ' + res.status + ' : ' + errText.slice(0, 150));
    }
    const data = await res.json();
    const first = (data?.data && data.data[0]) || (data?.images && data.images[0]) || null;
    const b64 = (first && (first.b64_json || (typeof first === 'string' ? first : null))) || null;

    loadingDiv.remove();

    if (!b64) {
      const errDiv = document.createElement('div');
      errDiv.className = 'msg image-loading';
      errDiv.textContent = '⚠️ Venice : image non récupérée.';
      messagesEl.appendChild(errDiv);
    } else {
      const imgDiv = document.createElement('div');
      imgDiv.className = 'msg bot';
      imgDiv.innerHTML = `<img src="data:image/png;base64,${b64}" alt="Image générée (Venice)" style="max-width:100%; border-radius:10px;">`;
      messagesEl.appendChild(imgDiv);
    }
  } catch (err) {
    loadingDiv.remove();
    console.error('Erreur Venice:', err);
    const errDiv = document.createElement('div');
    errDiv.className = 'msg image-loading';
    errDiv.textContent = '❌ Venice : ' + (err.message || 'génération échouée');
    messagesEl.appendChild(errDiv);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ========== sendToWorker ==========
async function sendToWorker(userText, userTs) {
  const isInit = userText === '__init__';
  let typingEl = null;
  let botDiv = null;

  // Ouvert tout de suite, de façon SYNCHRONE, pour rester rattaché au geste utilisateur
  // (clic sur Envoyer) — si on attend le premier `await`, le navigateur bloque le popup.
  // Seulement si Perchance est activé pour ce profil, sinon pas de popup inutile.
  const imagePopup = genPerchance ? window.open('about:blank', '_blank') : null;
  function closeUnusedPopup() {
    if (imagePopup && !imagePopup.closed) { try { imagePopup.close(); } catch (e) {} }
  }

  try {
    sendBtn.disabled = true;
    typingEl = addMessage('...', 'typing');
    typingEl.classList.remove('msg');

    const messages = buildMessages(userText, isInit);
    const s = sampling || {};

    const response = await fetch(WORKER_BASE + provider, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Secret': password },
      body: JSON.stringify({
        model: model,
        messages: messages,
        stream: true,
        temperature: s.temperature ?? 1.0,
        top_p: s.top_p ?? 1.0,
        frequency_penalty: s.frequency_penalty ?? 0,
        presence_penalty: s.presence_penalty ?? 0,
        max_tokens: s.max_tokens ?? 800
      })
    });

    if (!response.ok) {
      typingEl.remove();
      closeUnusedPopup();
      const errText = await response.text();
      addMessage('Erreur ' + response.status + ' : ' + errText.slice(0, 200), 'err');
      return;
    }

    if (!response.body) {
      typingEl.remove();
      const data = await response.json();
      const botText = data?.choices?.[0]?.message?.content || JSON.stringify(data);
      addMessage(botText, 'bot');
      finalizeHistory(userText, botText, isInit, userTs);
      if (botText.length > 20) {
        speakQuotedText(botText);
        if (genPerchance) safeTrigger(() => generateNSFWImage(botText, imagePopup)); else closeUnusedPopup();
        if (genHFSpace) safeTrigger(() => generateHFSpaceImage(botText));
        if (genPollination) safeTrigger(() => generatePollinationImage(botText));
        if (genAIHorde) safeTrigger(() => generateAIHordeImage(botText));
        if (genVenice) safeTrigger(() => generateVeniceImage(botText));
      } else {
        closeUnusedPopup();
      }
      return;
    }

    typingEl.remove();
    botDiv = addMessage('', 'bot');
    const botContentEl = botDiv.querySelector('.msg-content');
    let fullText = '';

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const parsed = JSON.parse(payload);
          const delta = parsed?.choices?.[0]?.delta?.content || parsed?.choices?.[0]?.message?.content || '';
          if (delta) {
            fullText += delta;
            botContentEl.innerHTML = renderMarkdownBasic(fullText);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch (e) {}
      }
    }

    if (!fullText) botContentEl.innerHTML = '(réponse vide)';
    finalizeHistory(userText, fullText, isInit, userTs);

    if (fullText && fullText.length > 20) {
      speakQuotedText(fullText);
      if (genPerchance) safeTrigger(() => generateNSFWImage(fullText, imagePopup)); else closeUnusedPopup();
      if (genHFSpace) safeTrigger(() => generateHFSpaceImage(fullText));
      if (genPollination) safeTrigger(() => generatePollinationImage(fullText));
      if (genAIHorde) safeTrigger(() => generateAIHordeImage(fullText));
      if (genVenice) safeTrigger(() => generateVeniceImage(fullText));
    } else {
      closeUnusedPopup();
    }

  } catch (err) {
    closeUnusedPopup();
    if (typingEl) typingEl.remove();
    addMessage('Erreur réseau : ' + err.message, 'err');
  } finally {
    sendBtn.disabled = false;
  }
}

function finalizeHistory(userText, botText, isInit, userTs) {
  if (!isInit) history.push({ role: 'user', content: userText, ts: userTs || Date.now() });
  history.push({ role: 'assistant', content: botText, ts: Date.now() });
  persistCurrentHistory();
}

function handleSend() {
  const text = input.value.trim();
  if (!text) return;
  const ts = Date.now();
  addMessage(text, 'user', ts);
  input.value = '';
  input.style.height = 'auto';
  sendToWorker(text, ts);
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});
</script>
