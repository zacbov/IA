<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0f0d; color: #e8e8e4; height: 100vh; display: flex; flex-direction: column;
  }
  #setup {
    padding: 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #222;
    overflow-y: auto;
  }
  #setup.hidden { display: none; }
  #setup label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #999; }
  #setup input, #setup textarea, #setup select {
    width: 100%; background: #14201a; border: 1px solid #2a3d33; color: #e8e8e4;
    padding: 9px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  #setup textarea { min-height: 90px; resize: vertical; }
  #setup button {
    background: #e0a34a; border: none; color: #1a1208; font-weight: 700;
    padding: 11px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
  #setup button.secondary {
    background: none; border: 1px solid #333; color: #ccc; font-weight: 600;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #profileBar { display: flex; gap: 8px; align-items: flex-end; }
  #profileBar select { flex: 1; }
  #profileBar button { width: auto; padding: 9px 12px; font-size: 12px; margin-top: 0; white-space: nowrap; }
  hr.sep { border: none; border-top: 1px solid #222; margin: 6px 0; width: 100%; }
  details.advanced { border: 1px solid #222; border-radius: 8px; padding: 8px 10px; }
  details.advanced summary { cursor: pointer; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #999; }
  details.advanced .row { margin-top: 8px; }
  .fieldlabel { font-size: 10px; color: #888; display:block; margin-bottom:3px; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
    border-bottom: 1px solid #222; flex-shrink: 0; gap: 8px;
  }
  #topbar.hidden { display: none; }
  #topbar select {
    background: #14201a; border: 1px solid #2a3d33; color: #e8e8e4; border-radius: 6px;
    padding: 5px 8px; font-size: 11.5px; font-family: inherit; max-width: 140px;
  }
  #topbar div.actions { display: flex; gap: 6px; flex-shrink: 0; }
  #topbar button {
    background: none; border: 1px solid #333; color: #999; border-radius: 6px;
    padding: 5px 10px; font-size: 11px; cursor: pointer;
  }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #messages.hidden { display: none; }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 12px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #e0a34a; color: #1a1208; }
  .msg.bot { align-self: flex-start; background: #17221c; border: 1px solid #263329; }
  .msg.err { align-self: center; background: #3a1414; color: #e0a0a0; font-size: 12.5px; font-family: monospace; }
  .msg.image-loading {
    align-self: flex-start;
    background: #1a2a22;
    border: 1px dashed #3a5a4a;
    color: #a0c0b0;
    font-size: 13px;
    font-style: italic;
  }
  .msg img {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 8px;
    display: block;
  }
  #inputbar { display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom,0px) + 10px); border-top: 1px solid #222; flex-shrink: 0; }
  #inputbar.hidden { display: none; }
  #inputbar textarea {
    flex: 1; resize: none; background: #14201a; border: 1px solid #2a3d33; color: #e8e8e4;
    border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit; max-height: 100px;
  }
  #send { background: #e0a34a; border: none; color: #1a1208; font-weight: 700; width: 46px; border-radius: 10px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  #send:disabled { background: #3a3a34; color: #777; }
  .typing { align-self: flex-start; color: #777; font-size: 13px; font-style: italic; padding: 4px 4px; }
</style>
</head>
<body>

<div id="setup">
  <div id="profileBar">
    <div style="flex:2">
      <label>Profil enregistré</label>
      <select id="profileSelect"><option value="">— Nouveau profil —</option></select>
    </div>
    <button id="deleteProfileBtn" class="secondary" title="Supprimer ce profil">🗑</button>
  </div>
  <hr class="sep">
  <div class="row">
    <div>
      <label>Fournisseur</label>
      <select id="provider">
        <option value="groq">groq</option>
        <option value="openrouter">openrouter</option>
        <option value="cerebras">cerebras</option>
        <option value="mistral">mistral</option>
        <option value="nvidia">nvidia</option>
        <option value="hf">hf</option>
        <option value="zai">zai</option>
      </select>
    </div>
    <div>
      <label>Modèle</label>
      <input type="text" id="model" placeholder="ex: llama-3.1-8b-instant">
    </div>
  </div>
  <div>
    <label>Mot de passe (worker)</label>
    <input type="password" id="password" placeholder="Mot de passe">
  </div>
  <div>
    <label>Nom du profil</label>
    <input type="text" id="profileName" placeholder="ex: Perso A">
  </div>
  <div>
    <label>Prompt système / personnalité</label>
    <textarea id="systemPrompt" placeholder="Décris ici le personnage, le ton, le style de réponse attendu..."></textarea>
  </div>

  <details class="advanced">
    <summary>Paramètres de génération (avancé)</summary>
    <div class="row">
      <div>
        <span class="fieldlabel">Temperature</span>
        <input type="number" id="p_temperature" step="0.05" min="0" max="2" value="1.0">
      </div>
      <div>
        <span class="fieldlabel">Top P</span>
        <input type="number" id="p_top_p" step="0.05" min="0" max="1" value="1.0">
      </div>
    </div>
    <div class="row">
      <div>
        <span class="fieldlabel">Frequency penalty</span>
        <input type="number" id="p_frequency_penalty" step="0.05" min="-2" max="2" value="0">
      </div>
      <div>
        <span class="fieldlabel">Presence penalty</span>
        <input type="number" id="p_presence_penalty" step="0.05" min="-2" max="2" value="0">
      </div>
    </div>
    <div class="row">
      <div>
        <span class="fieldlabel">Max tokens</span>
        <input type="number" id="p_max_tokens" step="50" min="50" max="8000" value="800">
      </div>
    </div>
  </details>

  <button id="saveProfileBtn" class="secondary">💾 Enregistrer ce profil</button>
  <button id="startBtn">Démarrer la conversation</button>
</div>

<div id="topbar" class="hidden">
  <select id="quickSwitch"></select>
  <div class="actions">
    <button id="resetBtn">↺ Vider</button>
    <button id="backBtn">⚙ Config</button>
  </div>
</div>

<div id="messages" class="hidden"></div>

<div id="inputbar" class="hidden">
  <textarea id="input" rows="1" placeholder="Écris ton message..."></textarea>
  <button id="send">➤</button>
</div>

<script>
const WORKER_BASE = 'https://routeur-ia-proxy.zacharybov.workers.dev/proxy/';
const HISTORY_WINDOW = 8;
const STORAGE_KEY = 'chat_profiles_v2';
const LAST_PROFILE_KEY = 'chat_last_profile_v2';
const ELEVEN_VOICE_ID = "EXAVITQu4vr4xnSDxMaL";

let provider = 'groq';
let model = '';
let password = '';
let systemPrompt = '';
let profileName = '';
let sampling = {};
let history = [];

const setup = document.getElementById('setup');
const topbar = document.getElementById('topbar');
const messagesEl = document.getElementById('messages');
const inputbar = document.getElementById('inputbar');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const profileSelect = document.getElementById('profileSelect');
const quickSwitch = document.getElementById('quickSwitch');

// ---------- Stockage des profils ----------
function loadProfiles() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}
function saveProfiles(profiles) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
}

function readSamplingFromForm() {
  return {
    temperature: parseFloat(document.getElementById('p_temperature').value) || 1.0,
    top_p: parseFloat(document.getElementById('p_top_p').value) || 1.0,
    frequency_penalty: parseFloat(document.getElementById('p_frequency_penalty').value) || 0,
    presence_penalty: parseFloat(document.getElementById('p_presence_penalty').value) || 0,
    max_tokens: parseInt(document.getElementById('p_max_tokens').value) || 800
  };
}
function writeSamplingToForm(s) {
  s = s || {};
  document.getElementById('p_temperature').value = s.temperature ?? 1.0;
  document.getElementById('p_top_p').value = s.top_p ?? 1.0;
  document.getElementById('p_frequency_penalty').value = s.frequency_penalty ?? 0;
  document.getElementById('p_presence_penalty').value = s.presence_penalty ?? 0;
  document.getElementById('p_max_tokens').value = s.max_tokens ?? 800;
}

function refreshProfileSelects(selectName) {
  const profiles = loadProfiles();
  const names = Object.keys(profiles).sort();

  profileSelect.innerHTML = '<option value="">— Nouveau profil —</option>';
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    profileSelect.appendChild(opt);
  });
  if (selectName && profiles[selectName]) profileSelect.value = selectName;

  quickSwitch.innerHTML = '';
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    quickSwitch.appendChild(opt);
  });
  if (selectName) quickSwitch.value = selectName;
}

function fillFormFromProfile(name) {
  const p = loadProfiles()[name];
  if (!p) return;
  document.getElementById('provider').value = p.provider || 'groq';
  document.getElementById('model').value = p.model || '';
  document.getElementById('password').value = p.password || '';
  document.getElementById('profileName').value = name;
  document.getElementById('systemPrompt').value = p.systemPrompt || '';
  writeSamplingToForm(p.sampling);
}

profileSelect.addEventListener('change', () => {
  if (profileSelect.value) fillFormFromProfile(profileSelect.value);
});

document.getElementById('saveProfileBtn').addEventListener('click', () => {
  const name = document.getElementById('profileName').value.trim();
  if (!name) { alert("Donne un nom à ce profil avant de l'enregistrer."); return; }
  const profiles = loadProfiles();
  const existingHistory = (profiles[name] && profiles[name].history) || [];
  profiles[name] = {
    provider: document.getElementById('provider').value,
    model: document.getElementById('model').value.trim(),
    password: document.getElementById('password').value,
    systemPrompt: document.getElementById('systemPrompt').value.trim(),
    sampling: readSamplingFromForm(),
    history: existingHistory
  };
  saveProfiles(profiles);
  refreshProfileSelects(name);
  alert('Profil "' + name + '" enregistré.');
});

document.getElementById('deleteProfileBtn').addEventListener('click', () => {
  const name = profileSelect.value;
  if (!name) return;
  if (!confirm('Supprimer le profil "' + name + '" (et son historique) ?')) return;
  const profiles = loadProfiles();
  delete profiles[name];
  saveProfiles(profiles);
  refreshProfileSelects();
  document.getElementById('profileName').value = '';
});

window.addEventListener('DOMContentLoaded', () => {
  refreshProfileSelects();
  const lastUsed = localStorage.getItem(LAST_PROFILE_KEY);
  if (lastUsed && loadProfiles()[lastUsed]) {
    profileSelect.value = lastUsed;
    fillFormFromProfile(lastUsed);
  }
});

// ---------- Persistance de l'historique ----------
function persistCurrentHistory() {
  if (!profileName) return;
  const profiles = loadProfiles();
  if (!profiles[profileName]) return;
  profiles[profileName].history = history;
  saveProfiles(profiles);
}

function activateProfile(name, isSwitch) {
  const profiles = loadProfiles();
  const p = profiles[name];
  if (!p) return;

  if (isSwitch) persistCurrentHistory();

  profileName = name;
  provider = p.provider || 'groq';
  model = p.model || '';
  password = p.password || '';
  systemPrompt = p.systemPrompt || '';
  sampling = p.sampling || {};
  history = p.history || [];

  localStorage.setItem(LAST_PROFILE_KEY, profileName);

  messagesEl.innerHTML = '';
  history.forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'bot'));

  if (history.length === 0 && systemPrompt) {
    sendToWorker('__init__');
  }
}

// ---------- Démarrage / config ----------
document.getElementById('startBtn').addEventListener('click', () => {
  const pw = document.getElementById('password').value.trim();
  const mdl = document.getElementById('model').value.trim();
  const name = document.getElementById('profileName').value.trim();

  if (!pw) { alert('Entre le mot de passe du worker.'); return; }
  if (!mdl) { alert('Entre le nom du modèle à utiliser.'); return; }

  if (name) {
    const profiles = loadProfiles();
    const existingHistory = (profiles[name] && profiles[name].history) || [];
    profiles[name] = {
      provider: document.getElementById('provider').value,
      model: mdl,
      password: pw,
      systemPrompt: document.getElementById('systemPrompt').value.trim(),
      sampling: readSamplingFromForm(),
      history: existingHistory
    };
    saveProfiles(profiles);
    refreshProfileSelects(name);
  }

  setup.classList.add('hidden');
  topbar.classList.remove('hidden');
  messagesEl.classList.remove('hidden');
  inputbar.classList.remove('hidden');

  if (name) {
    activateProfile(name, false);
  } else {
    profileName = '';
    provider = document.getElementById('provider').value;
    model = mdl;
    password = pw;
    systemPrompt = document.getElementById('systemPrompt').value.trim();
    sampling = readSamplingFromForm();
    history = [];
    messagesEl.innerHTML = '';
    if (systemPrompt) sendToWorker('__init__');
  }
  input.focus();
});

quickSwitch.addEventListener('change', () => {
  if (quickSwitch.value && quickSwitch.value !== profileName) {
    activateProfile(quickSwitch.value, true);
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Vider l\'historique de cette conversation ?')) return;
  history = [];
  messagesEl.innerHTML = '';
  persistCurrentHistory();
  if (systemPrompt) sendToWorker('__init__');
});

document.getElementById('backBtn').addEventListener('click', () => {
  persistCurrentHistory();
  topbar.classList.add('hidden');
  messagesEl.classList.add('hidden');
  inputbar.classList.add('hidden');
  setup.classList.remove('hidden');
});

// ---------- Chat ----------
function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function buildMessages(userText, isInit) {
  const recent = history.slice(-HISTORY_WINDOW);
  const messages = [];
  if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
  for (const m of recent) messages.push({ role: m.role, content: m.content });
  if (isInit) {
    messages.push({ role: 'user', content: 'Initie la conversation maintenant, en restant fidèle au personnage et au ton décrits dans tes instructions système. Un seul message.' });
  } else {
    messages.push({ role: 'user', content: userText });
  }
  return messages;
}

// ========== ELEVENLABS TTS ==========
async function speakQuotedText(botText) {
  let textsToSpeak = [...botText.matchAll(/"([^"]+)"/g)].map(m => m[1].trim());

  if (textsToSpeak.length === 0) {
    const sentences = botText
      .split(/(?<=[.!?…])\s+/)
      .map(s => s.trim())
      .filter(s => s.length > 20);
    textsToSpeak = sentences.slice(0, 2);
  }

  if (textsToSpeak.length === 0) return;

  for (const text of textsToSpeak) {
    if (text.length < 5) continue;

    try {
      const response = await fetch(WORKER_BASE + "eleven-tts", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-App-Secret": password
        },
        body: JSON.stringify({
          text: text,
          voice_id: ELEVEN_VOICE_ID,
          model_id: "eleven_multilingual_v2"
        })
      });

      if (!response.ok) {
        console.error("Erreur TTS:", response.status);
        continue;
      }

      const audioBlob = await response.blob();
      const audioUrl = URL.createObjectURL(audioBlob);

      const audioDiv = document.createElement("div");
      audioDiv.className = "msg bot";
      audioDiv.innerHTML = `
        <div style="font-size:12px; color:#aaa; margin-bottom:8px;">🔊 Voix générée</div>
        <audio controls style="width:100%; max-width:380px; height:40px;"></audio>
      `;
      const audioEl = audioDiv.querySelector("audio");
      audioEl.src = audioUrl;

      messagesEl.appendChild(audioDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;

    } catch (err) {
      console.error("Erreur génération voix:", err);
    }
  }
}

// ========== GÉNÉRATION D'IMAGE ==========
async function generateNSFWImage(botText) {
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg image-loading';
  loadingDiv.textContent = '🎨 Génération de l\'image en cours...';
  messagesEl.appendChild(loadingDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const prompt = `masterpiece, best quality, highly detailed explicit erotic scene, ${botText.slice(0, 240)}, futanari, huge breasts, thick cock, wet, detailed anatomy`;

    const startRes = await fetch("https://properfool-nsfwadult.hf.space/gradio_api/call/generate_image", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        data: [prompt, 768, 512, 12, 0, true, 1]
      })
    });

    if (!startRes.ok) {
      loadingDiv.textContent = '❌ Erreur lors du lancement de l\'image';
      return;
    }

    const startData = await startRes.json();
    const eventId = startData.event_id;

    if (!eventId) {
      loadingDiv.textContent = '❌ Pas d\'event_id reçu';
      console.log(startData);
      return;
    }

    let imageUrl = null;
    for (let i = 0; i < 45; i++) {
      await new Promise(r => setTimeout(r, 1000));

      const pollRes = await fetch(`https://properfool-nsfwadult.hf.space/gradio_api/call/generate_image/${eventId}`);
      const pollText = await pollRes.text();

      if (pollText.includes('http') || pollText.includes('"url"')) {
        const match = pollText.match(/https?:\/\/[^\s"']+\.(png|jpg|jpeg|webp)/i);
        if (match) {
          imageUrl = match[0];
          break;
        }
      }

      if (pollText.includes('error') || pollText.includes('failed')) {
        loadingDiv.textContent = '❌ Échec de la génération';
        return;
      }
    }

    loadingDiv.remove();

    if (imageUrl) {
      const imgDiv = document.createElement('div');
      imgDiv.className = 'msg bot';
      imgDiv.innerHTML = `<img src="${imageUrl}" alt="Image générée" style="max-width:100%; border-radius:10px;">`;
      messagesEl.appendChild(imgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } else {
      const errDiv = document.createElement('div');
      errDiv.className = 'msg image-loading';
      errDiv.textContent = '⚠️ Image non récupérée';
      messagesEl.appendChild(errDiv);
    }

  } catch (err) {
    loadingDiv.remove();
    console.error("Erreur génération image:", err);
  }
}

async function sendToWorker(userText) {
  const isInit = userText === '__init__';
  let typingEl = null;
  let botDiv = null;
  try {
    sendBtn.disabled = true;
    typingEl = addMessage('...', 'typing');
    typingEl.classList.remove('msg');

    const messages = buildMessages(userText, isInit);
    const s = sampling || {};

    const response = await fetch(WORKER_BASE + provider, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Secret': password },
      body: JSON.stringify({
        model: model,
        messages: messages,
        stream: true,
        temperature: s.temperature ?? 1.0,
        top_p: s.top_p ?? 1.0,
        frequency_penalty: s.frequency_penalty ?? 0,
        presence_penalty: s.presence_penalty ?? 0,
        max_tokens: s.max_tokens ?? 800
      })
    });

    if (!response.ok) {
      typingEl.remove();
      const errText = await response.text();
      addMessage('Erreur ' + response.status + ' : ' + errText.slice(0, 200), 'err');
      return;
    }

    if (!response.body) {
      typingEl.remove();
      const data = await response.json();
      const botText = data?.choices?.[0]?.message?.content || JSON.stringify(data);
      addMessage(botText, 'bot');
      finalizeHistory(userText, botText, isInit);
      if (botText.length > 20) {
        speakQuotedText(botText);
        generateNSFWImage(botText);
      }
      return;
    }

    typingEl.remove();
    botDiv = addMessage('', 'bot');
    let fullText = '';

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const parsed = JSON.parse(payload);
          const delta = parsed?.choices?.[0]?.delta?.content || parsed?.choices?.[0]?.message?.content || '';
          if (delta) {
            fullText += delta;
            botDiv.textContent = fullText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch (e) {}
      }
    }

    if (!fullText) botDiv.textContent = '(réponse vide)';
    finalizeHistory(userText, fullText, isInit);

    if (fullText && fullText.length > 20) {
      speakQuotedText(fullText);
      generateNSFWImage(fullText);
    }

  } catch (err) {
    if (typingEl) typingEl.remove();
    addMessage('Erreur réseau : ' + err.message, 'err');
  } finally {
    sendBtn.disabled = false;
  }
}

function finalizeHistory(userText, botText, isInit) {
  if (!isInit) history.push({ role: 'user', content: userText });
  history.push({ role: 'assistant', content: botText });
  persistCurrentHistory();
}

function handleSend() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';
  input.style.height = 'auto';
  sendToWorker(text);
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});
</script>
</body>
</html>
